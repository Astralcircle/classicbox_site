location ^~ /emojis/ {
	alias /var/www/emojis/;
	autoindex off;
	charset utf-8;
	expires 1h;
	add_header Access-Control-Allow-Origin *;
}

location = /emojis/emojis.json {
	alias /var/www/emojis/emojis.json;
	default_type application/json;
	charset utf-8;
	expires 5m;
	add_header Access-Control-Allow-Origin *;
}
