location = /vtf/get {
	proxy_pass http://127.0.0.1:8765/get;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_read_timeout 60s;
	client_max_body_size 4k;
}

location ^~ /vtf/files/ {
	alias /var/lib/vtf-service/files/;
	autoindex off;
	expires 7d;
	add_header Access-Control-Allow-Origin *;
}
